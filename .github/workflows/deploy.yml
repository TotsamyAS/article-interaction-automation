name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" || { echo "Repository variable DEPLOY_HOST is required" >&2; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Repository secret DEPLOY_SSH_KEY is required" >&2; exit 1; }
          test -n "$ROUTERAI_API_KEY" || { echo "Repository secret ROUTERAI_API_KEY is required" >&2; exit 1; }
          python3 - "$DEPLOY_HOST" <<'PY'
          import ipaddress
          import sys
          try:
              ip = ipaddress.ip_address(sys.argv[1])
          except ValueError as exc:
              raise SystemExit(f"DEPLOY_HOST must be the server's public IP address: {exc}")
          if ip.version != 4:
              raise SystemExit("This deployment currently expects a public IPv4 address in DEPLOY_HOST")
          PY

      - name: Prepare SSH and runtime secret
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          ROUTERAI_API_KEY: ${{ secrets.ROUTERAI_API_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 0600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          umask 077
          printf '%s' "$ROUTERAI_API_KEY" > routerai.key

      - name: Package tracked files
        run: git archive --format=tar.gz --output=release.tar.gz HEAD

      - name: Upload release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          scp release.tar.gz routerai.key "root@${DEPLOY_HOST}:/tmp/"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          ssh "root@${DEPLOY_HOST}" "RELEASE_SHA='${GITHUB_SHA}' APP_PUBLIC_IP='${DEPLOY_HOST}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          export DEBIAN_FRONTEND=noninteractive
          if ! command -v curl >/dev/null 2>&1 || ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ca-certificates curl python3
          fi

          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ca-certificates curl python3
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            . /etc/os-release
            cat >/etc/apt/sources.list.d/docker.sources <<DOCKER_REPO
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: ${UBUNTU_CODENAME:-$VERSION_CODENAME}
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          DOCKER_REPO
            apt-get update
            apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          fi
          systemctl enable --now docker

          APP_ROOT=/opt/article-interaction-automation
          ENV_FILE=/etc/article-interaction-automation.env
          ARCHIVE="/tmp/release.tar.gz"
          ROUTER_KEY_FILE="/tmp/routerai.key"
          RELEASE_DIR="${APP_ROOT}/releases/${RELEASE_SHA}"

          python3 - "$ROUTER_KEY_FILE" "$ENV_FILE" <<'PYENV'
          import secrets
          import sys
          from pathlib import Path

          router_key_path = Path(sys.argv[1])
          env_path = Path(sys.argv[2])
          router_key = router_key_path.read_text(encoding="utf-8").strip()
          if not router_key:
              raise SystemExit("Uploaded ROUTERAI_API_KEY is empty")

          invitation_key = ""
          if env_path.exists():
              for raw_line in env_path.read_text(encoding="utf-8").splitlines():
                  if raw_line.startswith("INVITATION_SIGNING_KEY="):
                      invitation_key = raw_line.split("=", 1)[1].strip()
                      break
          if not invitation_key or invitation_key.startswith("replace-"):
              invitation_key = secrets.token_hex(32)

          env_path.write_text(
              f"ROUTERAI_API_KEY={router_key}\n"
              f"INVITATION_SIGNING_KEY={invitation_key}\n",
              encoding="utf-8",
          )
          env_path.chmod(0o600)
          PYENV
          rm -f "$ROUTER_KEY_FILE"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          rm -f "$ARCHIVE"
          exec env RELEASE_SHA="$RELEASE_SHA" APP_PUBLIC_IP="$APP_PUBLIC_IP" bash "$RELEASE_DIR/deploy/remote-deploy.sh"
          REMOTE
