services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - experiment-data:/data
    init: true
    environment:
      INVITATION_SIGNING_KEY: ${INVITATION_SIGNING_KEY:?Set INVITATION_SIGNING_KEY in the root .env yourself}
      ROUTERAI_API_KEY: ${ROUTERAI_API_KEY:?Set ROUTERAI_API_KEY in the root .env yourself}
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; from app.config import load_settings; urllib.request.urlopen(f'http://localhost:{load_settings().port}/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:3033:3033"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "const c=await Bun.file('config.json').json(); const r=await fetch('http://localhost:'+c.port+'/health'); if(!r.ok) process.exit(1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  experiment-data:
