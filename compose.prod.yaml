services:
  caddy:
    image: caddy:2.11.4-alpine
    environment:
      APP_PUBLIC_IP: ${APP_PUBLIC_IP:?APP_PUBLIC_IP must be exported by deploy/remote-deploy.sh}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
